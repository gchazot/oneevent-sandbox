name: Build and test Image

on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEVELOPMENT: 'True'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pipenv
          pipenv sync
      - name: Run Django Checks
        run: pipenv run python manage.py check
      - name: Run Tests
        run: pipenv run python manage.py test
      - name: Check Django Migrations
        run: pipenv run python manage.py makemigrations --dry-run --check

  build-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/oneevent-sandbox:latest
            ghcr.io/${{ github.repository_owner }}/oneevent-sandbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
